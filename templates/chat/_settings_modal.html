<dialog id="settings-dialog" class="modal" aria-labelledby="settings-title">
  <form method="post" action="{% url 'chat:settings' conversation.id %}" class="modal-card">
    {% csrf_token %}
    <div class="dialog-head">
      <div>
        <h3 class="dialog-title" id="settings-title">Conversation settings</h3>
        <p class="dialog-sub">Tune the model, creativity and grounding for this thread only.</p>
      </div>
      <button type="button" class="icon-btn" data-close-dialog aria-label="Close settings">
        <svg class="icon"><use href="#i-close"></use></svg>
      </button>
    </div>

    <div class="dialog-body">
      <div class="field">
        <label class="field-label" for="id_title">Title</label>
        <input type="text" name="title" id="id_title" class="field-input" maxlength="120"
               value="{{ conversation.title }}" required>
      </div>

      <div class="field">
        <label class="field-label" for="id_model">
          Model
          <span class="field-hint">Leave on default to follow the server configuration.</span>
        </label>
        {{ settings_form.model }}
      </div>

      <div class="field">
        <label class="field-label" for="temperature-range">
          Temperature
          <span class="field-hint">Lower is focused, higher is exploratory.</span>
        </label>
        <div class="range-row">
          <input type="range" id="temperature-range" name="temperature" min="0" max="2" step="0.1"
                 value="{{ conversation.temperature }}" data-temp-range>
          <output class="range-value" for="temperature-range" data-temp-value>{{ conversation.temperature }}</output>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="id_system_prompt">
          System prompt
          <span class="field-hint">Persona and rules for the assistant.</span>
        </label>
        {{ settings_form.system_prompt }}
      </div>

      <label class="checkbox-row" for="id_use_documents">
        <input type="checkbox" name="use_documents" id="id_use_documents" class="checkbox-input"
               {% if conversation.use_documents %}checked{% endif %}>
        <span class="checkbox-copy">
          <strong>Ground answers in documents</strong>
          Retrieve relevant passages from attached files and cite them inline.
        </span>
      </label>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" data-close-dialog>Cancel</button>
      <button type="submit" class="btn btn-primary">
        <svg class="icon"><use href="#i-check"></use></svg>
        Save settings
      </button>
    </div>
  </form>
</dialog>
