{% extends "base_public.html" %}

{% block title %}Check your inbox — Nebula{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card" style="text-align:center">
    <div class="auth-header">
      <span class="auth-icon"><svg class="icon"><use href="#i-check"></use></svg></span>
      <h1>Check your inbox</h1>
      <p>If an account exists for that address, a password reset link is on its way. The link expires in a few hours.</p>
    </div>
    <p class="auth-footer"><a href="{% url 'login' %}">Return to sign in</a></p>
  </div>
</div>
{% endblock %}
