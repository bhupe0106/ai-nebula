{% extends "base_public.html" %}

{% block title %}Password updated — Nebula{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card" style="text-align:center">
    <div class="auth-header">
      <span class="auth-icon"><svg class="icon"><use href="#i-shield"></use></svg></span>
      <h1>Password updated</h1>
      <p>Your new password is active. Sign in to get back to your workspace.</p>
    </div>
    <a href="{% url 'login' %}" class="btn btn-primary btn-block">Sign in</a>
  </div>
</div>
{% endblock %}
